#MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

server.servlet.context-path=/api/v1.0

#JPA properties
#Local default: Hibernate creates/updates the tables and SQL is printed.
#Production (application-prod.properties) uses Flyway migrations and keeps SQL out of the logs.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

#Email configuration (Brevo HTTP API; SMTP ports are blocked on Render's free plan)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:${BREVO_SENDER_MAIL:crifigshe@gmail.com}}
brevo.sender-name=Money Manager

#Token parameters
auth.token.expirationInMils=3600000
# Base64 secret, at least 32 bytes. Generate with: openssl rand -base64 64
auth.token.jwtSecret=${JWT_SECRET:}

#Front-end url
money.manager.frontendUrl=${MONEY_MANAGER_FRONTEND_URL}


spring.profiles.active=prod

#CORS: origins allowed to call the API from a browser (comma separated, * wildcards allowed).
#Default: the production front-end, its Netlify deploy previews and local Vite dev/preview servers.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://money-manager-cristian.netlify.app,https://*--money-manager-cristian.netlify.app,http://localhost:5173,http://localhost:4173}

#Scheduled emails: triggered from outside (GitHub Actions) because Render's free instance sleeps.
#Requests to /internal/jobs/* must send this value in the X-Jobs-Secret header; empty = jobs disabled.
app.jobs.secret=${JOBS_SECRET:}

#Attachments (F15): files up to 2 MB (checked again in AttachmentService)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
