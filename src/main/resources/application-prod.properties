#PostgreSQL Configuration
spring.datasource.url=${POSTGRESQL_URL}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}

#Schema: versioned with Flyway (src/main/resources/db/migration). Hibernate only checks
#that the entities match the tables and never changes them.
#Existing databases (created earlier by ddl-auto=update) are marked as version 1 on first start;
#empty databases get V1 applied. Any entity change needs a new V2__..., V3__... script.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

#Logs: no SQL statements in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=warn
