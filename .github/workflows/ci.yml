name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL so the integration test can run the Flyway migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moneymanager
          POSTGRES_USER: moneymanager
          POSTGRES_PASSWORD: moneymanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneymanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRESQL_URL: jdbc:postgresql://localhost:5432/moneymanager
      POSTGRESQL_USERNAME: moneymanager
      POSTGRESQL_PASSWORD: moneymanager
      MONEY_MANAGER_FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify
